FROM swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/library/busybox:latest

WORKDIR /app

COPY prometheus-webhook .

EXPOSE 8080

ENTRYPOINT ["./prometheus-webhook"]
[root@demo go]# cat deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus-webhook
  namespace: test
spec:
  selector:
    matchLabels:
      app: prometheus-webhook
  template:
    metadata:
      labels:
        app: prometheus-webhook
    spec:
      containers:
      - name: prometheus-webhook
        image: prometheus-webhook:v5
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus-webhook
  namespace: test
spec:
  ports:
  - name: prometheus-webhook
    port: 8080
    protocol: TCP
    targetPort: 8080
  selector:
    app: prometheus-webhook
  type: NodePort
